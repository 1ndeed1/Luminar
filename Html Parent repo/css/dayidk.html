<!-- Media query html -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: yellowgreen;
        }
        .box{
            height: 100px;
        }
        @media print{
            h1{
                color:yellow;
            }
        }
        @media screen and (min-width : 500px){
            .box{
                background-color: brown;
            }
        }
        @media screen and (max-width :700px){
            .box{
                background-color: black;
            }
        }
    </style>
 </head>
 <body>
    <h1>Holaaa!!</h1>
    <div class="box">
        <h1>welcome to media screen</h1>
    </div>
 </body>
 </html>
